<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Desk</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply a saved or ?theme= override before first paint.
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      try { t = t || localStorage.getItem("desk-theme"); } catch (e) {}
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111110'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/desk" aria-label="Desk home">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="7" class="brand-bg"/><path d="M7 21l6-6 4 4 8-9" class="brand-fg"/></svg>
        <span>IWillBeatS&amp;P</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#/desk" data-nav="desk">Desk</a>
        <a href="#/book/champion" data-nav="book">Books</a>
        <a href="#/research" data-nav="research">Research</a>
        <a href="#/health" data-nav="health">Health</a>
      </nav>
      <div class="topbar-right">
        <span class="paper-chip" title="All accounts are Alpaca paper accounts. This page cannot place orders.">Paper</span>
        <span class="asof" id="asof"></span>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle light or dark theme" title="Theme">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh data" title="Refresh">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5V7h-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="foot">
    <span>Read-only. Reads the logs the bots commit; never places orders or touches broker keys.</span>
  </footer>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
