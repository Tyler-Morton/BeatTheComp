name: Daily Portfolio Rebalance

on:
  # Primary: cron-job.org POSTs to GitHub's dispatch API at 6:30 AM PT. It fires within about
  # 5 seconds, which gets around GitHub's unreliable internal cron.
  repository_dispatch:
    types: [market_open_trigger]

  # Fallback only: GitHub's own cron, which can lag 15 min to 3 hours. The duplicate-run guard
  # in main.py stops a run once today's row is logged. There's no concurrency key, so two runs
  # that overlap could both get past it.
  schedule:
    - cron: "32 13 * * 1-5"   # 6:32 AM PDT / 5:32 AM PST
    - cron: "00 14 * * 1-5"   # 7:00 AM PDT / 6:00 AM PST
    - cron: "32 14 * * 1-5"   # 7:32 AM PDT / 6:32 AM PST
    - cron: "00 15 * * 1-5"   # 8:00 AM PDT / 7:00 AM PST
    - cron: "30 15 * * 1-5"   # 8:30 AM PDT / 7:30 AM PST
    - cron: "00 16 * * 1-5"   # 9:00 AM PDT / 8:00 AM PST

  workflow_dispatch:  # manual trigger

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit updated CSV logs + price cache
        if: always()   # run even if the pipeline failed, to keep partial state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include the parquet cache so rate-limited runs can fall back to it.
          # These have to be git glob pathspecs, not shell globs. The old line named ignored files
          # (alerts.log, and trending_raw.csv through the shell's *.csv), which makes `git add` exit
          # non-zero. On the runner's git 2.54 it staged nothing at all, so daily rows were written
          # and then silently dropped, and `2>/dev/null || true` hid it. Local git 2.50 still stages
          # the valid paths, so this only broke in CI. `:(glob)` keeps `*` from crossing `/`, so it
          # stays at the root and skips challenger/. Glob pathspecs also skip ignored files without
          # an error under either git version.
          git add -A -- ':(glob)*.csv' ':(glob)*.parquet'
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Daily log $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The loop's exit status is sleep's, so three failed pushes would end this step green
          # and lose the day's rows with no signal. A failed rebase also stays in progress and
          # dooms the retries, so it gets aborted.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Could not push logs after 3 attempts"; exit 1; }

      # V3 paper shadow (EXP-024/027). Read-only, and it runs strictly after the champion: it reads
      # the prices_cache.parquet and daily_log.csv the champion wrote this run, once they're
      # committed and pushed. It gets no secrets or Alpaca keys, so it can't trade, and it's
      # continue-on-error with a timeout, so a crash, hang or push failure can't block or alter the
      # champion. It writes only shadow_v3_log.csv and shadow_v3_state.json. It skips days the
      # champion logged no row (market closed, duplicate cron firing) and days it already logged.
      - name: V3 paper shadow (read-only, no orders)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python shadow_v3.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each file only if it exists: a missing pathspec makes `git add` fatal.
          for f in shadow_v3_log.csv shadow_v3_state.json; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Shadow V3 log $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Could not push shadow log after 3 attempts"; exit 1; }
