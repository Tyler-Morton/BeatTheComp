name: Daily Portfolio Rebalance

on:
  schedule:
    # Market opens at 6:30 AM PT. GitHub free-tier cron is unreliable — can
    # be delayed 15min to several hours. So we schedule MULTIPLE times.
    # The duplicate-run guard in main.py ensures only the first successful
    # run does the full pipeline; subsequent runs exit immediately.
    # Covers both PDT (UTC-7) and PST (UTC-8) seasons.
    - cron: "32 13 * * 1-5"   # 6:32 AM PDT / 5:32 AM PST
    - cron: "00 14 * * 1-5"   # 7:00 AM PDT / 6:00 AM PST
    - cron: "32 14 * * 1-5"   # 7:32 AM PDT / 6:32 AM PST
    - cron: "00 15 * * 1-5"   # 8:00 AM PDT / 7:00 AM PST
    - cron: "30 15 * * 1-5"   # 8:30 AM PDT / 7:30 AM PST
    - cron: "00 16 * * 1-5"   # 9:00 AM PDT / 8:00 AM PST
  workflow_dispatch:  # manual trigger

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit updated CSV logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv alerts.log || true
          git commit -m "Daily log $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          # Pull any new commits with rebase before pushing — prevents race conditions
          # if user pushed code while the bot was mid-run.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
