name: Daily Portfolio Rebalance

on:
  # PRIMARY: external cron (cron-job.org) POSTs to GitHub's dispatch API at
  # 6:30 AM PT sharp. Fires within ~5 seconds — defeats GitHub's unreliable
  # internal cron.
  repository_dispatch:
    types: [market_open_trigger]

  # FALLBACK: GitHub's own cron (can lag 15min–3hr). Safety net only.
  # Duplicate-run guard in main.py ensures only the first run does work.
  schedule:
    - cron: "32 13 * * 1-5"   # 6:32 AM PDT / 5:32 AM PST
    - cron: "00 14 * * 1-5"   # 7:00 AM PDT / 6:00 AM PST
    - cron: "32 14 * * 1-5"   # 7:32 AM PDT / 6:32 AM PST
    - cron: "00 15 * * 1-5"   # 8:00 AM PDT / 7:00 AM PST
    - cron: "30 15 * * 1-5"   # 8:30 AM PDT / 7:30 AM PST
    - cron: "00 16 * * 1-5"   # 9:00 AM PDT / 8:00 AM PST

  workflow_dispatch:  # manual trigge

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit updated CSV logs + price cache
        if: always()   # run even if pipeline failed — useful for partial state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include parquet cache so future rate-limited runs can fall back to it.
          # NOTE: these must be git-glob pathspecs, not shell globs. The old line
          # named ignored files explicitly (alerts.log, and trending_raw.csv via the
          # shell's *.csv), which makes `git add` exit non-zero — and on the runner's
          # git 2.54 it staged NOTHING at all, so every daily row from 2026-07-07 on
          # was written and then silently dropped ("Nothing to commit" while the log
          # said it had just written the row). `2>/dev/null || true` hid the whole
          # thing. Local git 2.50 still stages the valid paths, which is why this
          # only broke in CI. `:(glob)` keeps `*` from crossing `/` (root-only, so we
          # don't grab challenger/), and glob pathspecs skip ignored files silently
          # instead of erroring — correct under either git version.
          git add -A -- ':(glob)*.csv' ':(glob)*.parquet'
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Daily log $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
