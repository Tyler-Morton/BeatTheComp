name: Daily Portfolio Rebalance

on:
  schedule:
    # Market opens at 9:30 AM ET = 6:30 AM PT.
    # GitHub cron uses UTC. We schedule BOTH DST and non-DST times so the bot
    # always fires within a few minutes of market open year-round.
    # The market_open check in broker.py + drift gate prevent duplicate trades.
    - cron: "32 13 * * 1-5"   # 6:32 AM PDT (March–November)
    - cron: "32 14 * * 1-5"   # 6:32 AM PST (November–March)
  workflow_dispatch:  # manual trigger

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit updated CSV logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv alerts.log || true
          git commit -m "Daily log $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push
