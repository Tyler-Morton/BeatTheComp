name: Challenger Daily Rebalance

on:
  # Primary: the same cron-job.org dispatch that fires the champion at 6:30 AM PT, so one
  # external trigger runs both bots. challenger_trigger is there to fire this one separately.
  repository_dispatch:
    types: [market_open_trigger, challenger_trigger]

  # Fallback: GitHub's own cron, which can lag 15 min to 3 hours. Offset about 10 min from the
  # champion's entries so the two workflows' log commits don't race. The duplicate-run guard
  # in challenger/main.py stops a run once today's row is logged. There's no concurrency key,
  # so two runs that overlap could both get past it.
  schedule:
    - cron: "42 13 * * 1-5"   # 6:42 AM PDT
    - cron: "10 14 * * 1-5"   # 7:10 AM PDT
    - cron: "42 14 * * 1-5"   # 7:42 AM PDT
    - cron: "10 15 * * 1-5"   # 8:10 AM PDT
    - cron: "40 15 * * 1-5"   # 8:40 AM PDT
    - cron: "10 16 * * 1-5"   # 9:10 AM PDT

  workflow_dispatch:  # manual trigger

jobs:
  challenger:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run challenger pipeline
        env:
          CHALLENGER_ALPACA_API_KEY: ${{ secrets.CHALLENGER_ALPACA_API_KEY }}
          CHALLENGER_ALPACA_SECRET_KEY: ${{ secrets.CHALLENGER_ALPACA_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python challenger/main.py

      - name: Commit challenger logs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only challenger files. They don't overlap the champion's commit set, so concurrent
          # runs can always rebase cleanly past each other.
          # live_prices.parquet is gitignored because Tiingo's plans don't allow sharing the data.
          # Don't name it here: naming an ignored file makes `git add` fail (see rebalance.yml).
          git add challenger/daily_log.csv
          # Separate add with the failure hidden, in case this file doesn't exist yet.
          git add challenger/base_state.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Challenger log $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Fail loudly if all pushes fail. The loop's exit status is sleep's, so it would end green.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Could not push logs after 3 attempts"; exit 1; }
